name: Empirical dynamics atlas MATLAB

on:
  workflow_dispatch:
  push:
    tags: ['matlab-dynamics-atlas-*']

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sam-sooter/prox_crit_toolkit
          ref: f26c782dca3b1c9ab18cc92c6449591c44e0d507
          path: external/prox_crit_toolkit
          persist-credentials: false
          sparse-checkout: /src/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archived counts and prepare scientific controls
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 h5py==3.13.0 remfile==0.1.16
          python research/criticality_dynamics_atlas/tests.py
          python research/criticality_dynamics_atlas/analyse.py fitting --fetch --out atlas_work
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          for entry in json.loads(Path("atlas_work/plan.json").read_text()):
              raw=Path(entry["receipt"]).with_suffix(".mat").read_bytes()
              assert sha256(raw).hexdigest()==entry["input_sha256"]
          PY
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Optimization_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('scripts/ci','research/criticality_dynamics_atlas'); fit_atlas
      - uses: actions/upload-artifact@v4
        with:
          name: dynamics-atlas-fits
          path: |
            atlas_work/*.fits.json
            atlas_work/plan.json
            atlas_work/unit.json
            atlas_work/sensitivities.json
            atlas_work/theory.json
          if-no-files-found: error
