name: MATLAB PNAS Replication

on:
  workflow_dispatch:
    inputs:
      stage:
        description: MATLAB stage
        type: choice
        default: smoke
        options:
          - smoke
          - synthetic
          - mouse
  push:
    tags:
      - 'matlab-smoke-*'
      - 'matlab-synthetic-*'
      - 'matlab-mouse-*'

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Verify Colab to runner transfer
        run: sha256sum -c data/fixtures/drive-probe.sha256

      - name: Fetch pinned Sooter toolkit
        uses: actions/checkout@v4
        with:
          repository: sam-sooter/prox_crit_toolkit
          ref: f26c782dca3b1c9ab18cc92c6449591c44e0d507
          path: external/prox_crit_toolkit
          persist-credentials: false
          sparse-checkout: |
            /src/
            /demo/demo.mlx
          sparse-checkout-cone-mode: false

      - name: Prepare the official synthetic demo section
        run: |
          df -h "$RUNNER_TEMP"
          python3 scripts/ci/prepare_demo.py

      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >
            Optimization_Toolbox
            Parallel_Computing_Toolbox

      - name: Check MATLAB environment
        uses: matlab-actions/run-command@v3
        with:
          command: ver

      - name: Run the official d2 smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('scripts/ci'); run_smoke

      - name: Validate the synthetic d2 estimator
        if: inputs.stage == 'synthetic' || startsWith(github.ref, 'refs/tags/matlab-synthetic-')
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('scripts/ci'); run_synthetic

      - name: Verify prepared mouse counts
        if: inputs.stage == 'mouse' || startsWith(github.ref, 'refs/tags/matlab-mouse-')
        run: sha256sum -c data/fixtures/mouse_population_40ms.sha256

      - name: Replicate the 13-session mouse comparison
        if: inputs.stage == 'mouse' || startsWith(github.ref, 'refs/tags/matlab-mouse-')
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('scripts/ci'); run_pnas_mouse

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-results
          path: |
            results/
            figures/
            reports/
          if-no-files-found: ignore
