name: Build and deploy Sleep Criticality Atlas

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/atlas/**'
      - 'results/**'
      - 'manifests/**'
      - '.github/workflows/atlas-pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/atlas/**'
      - 'results/**'
      - 'manifests/**'
      - '.github/workflows/atlas-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify source digests and atlas JSON
        run: python3 scripts/atlas/validate_atlas_data.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build and test the static website
        working-directory: website
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish atlas
        id: deployment
        uses: actions/deploy-pages@v4
