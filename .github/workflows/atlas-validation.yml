name: Phase 11 targeted MATLAB validation

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Targeted count fixture'
        type: choice
        options: [v1, qc, shorter, pairwise, extension]
        default: v1
  push:
    tags: ['matlab-phase11-*']

permissions:
  contents: read

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_SCENARIO: ${{ inputs.scenario || (startsWith(github.ref_name, 'matlab-phase11-pairwise-') && 'pairwise') || (startsWith(github.ref_name, 'matlab-phase11-extension-') && 'extension') || (startsWith(github.ref_name, 'matlab-phase11-shorter-') && 'shorter') || (startsWith(github.ref_name, 'matlab-phase11-qc-') && 'qc') || 'v1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 11 counts
        run: |
          case "$ATLAS_SCENARIO" in
            pairwise|extension) batch=phase11_1 ;;
            *) batch=phase11 ;;
          esac
          sha256sum -c "data/fixtures/$batch/$ATLAS_SCENARIO/validation_input.sha256"
      - name: Fetch pinned Sooter toolkit
        uses: actions/checkout@v4
        with:
          repository: sam-sooter/prox_crit_toolkit
          ref: f26c782dca3b1c9ab18cc92c6449591c44e0d507
          path: external/prox_crit_toolkit
          persist-credentials: false
          sparse-checkout: /src/
          sparse-checkout-cone-mode: false
      - name: Install MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Optimization_Toolbox
      - name: Fit only the selected count series
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('scripts/ci'); run_atlas_validation
      - name: Save spot-check fits
        uses: actions/upload-artifact@v4
        with:
          name: atlas-validation
          path: results/validation/runner/matlab_fits.json
          if-no-files-found: error
